<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - SMT线边仓管理系统</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0/dist/iife/sdk.js"></script>
  <script src="lib/xlsx.full.min.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <div id="login-view">
    <div class="login-card">
      <h1>SMT 线边仓管理系统</h1>
      <p>请登录</p>
      <input type="email" id="login-email" placeholder="邮箱" autocomplete="username">
      <input type="password" id="login-password" placeholder="密码" autocomplete="current-password">
      <button id="login-btn">登录</button>
      <p id="login-error" class="error"></p>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
