<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入库明细 - SMT线边仓管理系统</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0/dist/iife/sdk.js"></script>
  <script src="lib/xlsx.full.min.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div id="app-view">
    <header>
      <h1>SMT 线边仓管理系统</h1>
      <div class="user-info">
        <span id="user-name"></span>
        <button id="logout">退出</button>
      </div>
    </header>

    <nav>
      <a href="wo.html">工单管理</a>
      <a href="issue.html">生产领料</a>
      <a href="return.html">生产退料</a>
      <a href="finish.html" class="active">成品入库</a>
    </nav>

    <main>
      <!-- 返回按钮 -->
      <div class="toolbar">
        <button onclick="location.href='finish.html'">← 返回列表</button>
      </div>

      <!-- 工单信息卡片 -->
      <div class="card" id="wo-info-card">
        <h2 id="wo-title">加载中...</h2>
        <div class="wo-meta">
          <span>成品料号：<b id="wo-product-number">-</b></span>
          <span>产品名称：<b id="wo-product-name">-</b></span>
          <span>计划数量：<b id="wo-plan-qty">-</b></span>
          <span>生产日期：<b id="wo-produce-date">-</b></span>
          <span>状态：<b id="wo-status">-</b></span>
        </div>
        <!-- 入库进度条 -->
        <div style="margin-top:16px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;color:#555;margin-bottom:6px;">
            <span>已入库：<b id="finished-qty" style="color:#2563eb;">0</b></span>
            <span>未入库：<b id="remain-qty" style="color:#d33;">0</b></span>
            <span>进度：<b id="progress-text">0%</b></span>
          </div>
          <div style="height:10px;background:#e5e7eb;border-radius:5px;overflow:hidden;">
            <div id="progress-bar" style="width:0%;height:100%;background:#2563eb;transition:width .3s;"></div>
          </div>
        </div>
      </div>

      <!-- 入库记录 -->
      <div class="toolbar" style="margin-top:24px;">
        <h3 style="flex:1;">入库记录</h3>
        <button id="detail-add">新增入库单</button>
        <button id="detail-export">导出CSV</button>
      </div>
      <table id="detail-table">
        <thead>
          <tr>
            <th>成品料号</th>
            <th>入库数量</th>
            <th>入库人</th>
            <th>入库时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
  </div>

  <!-- 新增入库单弹窗 -->
  <div id="detail-modal" class="modal-mask hidden">
    <div class="modal-box">
      <h3>新增入库单</h3>
      <label>成品料号
        <input id="detail-form-part" type="text" readonly
               style="background:#f3f4f6;cursor:not-allowed;">
      </label>
      <label>入库数量（最多 <span id="detail-max-hint">0</span>）
        <input id="detail-form-qty" type="number" placeholder="输入入库数量">
      </label>
      <label>入库人
        <input id="detail-form-operator" type="text" placeholder="入库人">
      </label>
      <p id="detail-form-error" class="error"></p>
      <div class="modal-actions">
        <button id="detail-form-cancel" class="btn-cancel">取消</button>
        <button id="detail-form-save" class="btn-save">保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="finish-detail.js"></script>
  <script src="login.js"></script>
</body>
</html>
