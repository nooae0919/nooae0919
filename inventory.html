<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>库存管理 - SMT线边仓管理系统</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0/dist/iife/sdk.js"></script>
  <script src="lib/xlsx.full.min.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div id="app-view">
    <header>
      <h1>SMT 线边仓管理系统</h1>
      <div class="user-info">
        <span id="user-name"></span>
        <button id="logout">退出</button>
      </div>
    </header>
<nav>
  <a href="wo.html">工单管理</a>
  <a href="issue.html">生产领料</a>
  <a href="return.html">生产退料</a>
  <a href="finish.html">成品入库</a>
  <a href="inventory.html" class="active">库存管理</a>
  <a href="inventory-summary.html">库存汇总</a>
</nav>

    <main>
      <!-- 过滤提示（从汇总页跳转过来时显示） -->
      <div id="filter-notice" class="notice hidden">
        当前仅显示物料料号 <b id="filter-part-text"></b> 的库存明细。
        <a href="inventory.html" style="margin-left:10px;color:#2563eb;">清除过滤</a>
      </div>

      <div class="search-bar">
        <input id="inv-search" type="text" placeholder="按物料料号或名称搜索...">
        <button id="inv-search-btn">搜索</button>
        <button id="inv-clear-btn">清空</button>
      </div>

      <div class="toolbar">
        <button id="inv-add">新增库存</button>
        <button id="inv-import">导入CSV</button>
        <button id="inv-export">导出CSV</button>
        <input type="file" id="inv-file-input" accept=".csv" hidden>
      </div>

<table id="inv-table">
  <thead>
    <tr>
      <th style="width:60px;">序号</th>
      <th>物料料号</th>
      <th>物料名称</th>
      <th>物料数量</th>
      <th>库位</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
    </main>
  </div>

  <!-- 新增 / 编辑弹窗 -->
  <div id="inv-modal" class="modal-mask hidden">
    <div class="modal-box">
      <h3 id="inv-modal-title">新增库存</h3>
      <input type="hidden" id="inv-form-id">
      <label>物料料号
        <input id="inv-form-part" type="text" placeholder="如 M-2001">
      </label>
      <label>物料名称
        <input id="inv-form-name" type="text" placeholder="如 电阻0603">
      </label>
      <label>物料数量
        <input id="inv-form-qty" type="number" placeholder="如 1000">
      </label>
      <label>库位
        <input id="inv-form-loc" type="text" placeholder="如 A-1-01">
      </label>
      <p id="inv-form-error" class="error"></p>
      <div class="modal-actions">
        <button id="inv-form-cancel" class="btn-cancel">取消</button>
        <button id="inv-form-save" class="btn-save">保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="inventory.js"></script>
  <script src="login.js"></script>
</body>
</html>
