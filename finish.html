<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成品入库 - SMT线边仓管理系统</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0/dist/iife/sdk.js"></script>
  <script src="lib/xlsx.full.min.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div id="app-view">
    <header>
      <h1>SMT 线边仓管理系统</h1>
      <div class="user-info">
        <span id="user-name"></span>
        <button id="logout">退出</button>
      </div>
    </header>

    <nav>
      <a href="wo.html">工单管理</a>
      <a href="issue.html">生产领料</a>
      <a href="return.html">生产退料</a>
      <a href="finish.html" class="active">成品入库</a>
    </nav>

    <main>
      <div class="toolbar">
        <button id="finish-add">新增入库单</button>
        <button id="finish-import">导入CSV</button>
        <button id="finish-export">导出CSV</button>
        <input type="file" id="finish-file-input" accept=".csv" hidden>
      </div>
      <table id="finish-table">
        <thead>
          <tr>
            <th>工单号</th>
            <th>成品料号</th>
            <th>入库数量</th>
            <th>入库人</th>
            <th>入库时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
  </div>

  <!-- 新增入库弹窗 -->
  <div id="finish-modal" class="modal-mask hidden">
    <div class="modal-box">
      <h3>新增入库单</h3>
      <label>成品料号
        <input id="finish-form-part" type="text" placeholder="输入成品料号">
      </label>
      <label>关联工单
        <select id="finish-form-wo">
          <option value="">-- 请选择工单 --</option>
        </select>
      </label>
      <label>入库数量
        <input id="finish-form-qty" type="number" placeholder="入库数量">
      </label>
      <label>入库人
        <input id="finish-form-operator" type="text" placeholder="入库人">
      </label>
      <p id="finish-form-error" class="error"></p>
      <div class="modal-actions">
        <button id="finish-form-cancel" class="btn-cancel">取消</button>
        <button id="finish-form-save" class="btn-save">保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="login.js"></script>
  <script src="finish.js"></script>
</body>
</html>
