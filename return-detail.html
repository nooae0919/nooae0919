<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>退料明细 - SMT线边仓管理系统</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0/dist/iife/sdk.js"></script>
  <script src="lib/xlsx.full.min.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div id="app-view">
    <header>
      <h1>SMT 线边仓管理系统</h1>
      <div class="user-info">
        <span id="user-name"></span>
        <button id="logout">退出</button>
      </div>
    </header>

    <nav>
      <a href="wo.html">工单管理</a>
      <a href="issue.html">生产领料</a>
      <a href="return.html" class="active">生产退料</a>
      <a href="finish.html">成品入库</a>
    </nav>

    <main>
      <!-- 返回按钮 -->
      <div class="toolbar">
        <button onclick="location.href='return.html'">← 返回列表</button>
      </div>

      <!-- 工单信息卡片 -->
      <div class="card" id="wo-info-card">
        <h2 id="wo-title">加载中...</h2>
        <div class="wo-meta">
          <span>成品料号：<b id="wo-product-number">-</b></span>
          <span>产品名称：<b id="wo-product-name">-</b></span>
          <span>计划数量：<b id="wo-plan-qty">-</b></span>
          <span>生产日期：<b id="wo-produce-date">-</b></span>
          <span>状态：<b id="wo-status">-</b></span>
        </div>
      </div>

      <!-- 退料记录 -->
      <div class="toolbar" style="margin-top:24px;">
        <h3 style="flex:1;">退料记录</h3>
        <button id="detail-import">导入CSV</button>
        <button id="detail-export">导出CSV</button>
        <input type="file" id="detail-file-input" accept=".csv" hidden>
      </div>
      <table id="detail-table">
        <thead>
          <tr>
            <th>物料料号</th>
            <th>物料名称</th>
            <th>退料数量</th>
            <th>退料人</th>
            <th>退料时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <!-- 按物料汇总 -->
      <div class="toolbar" style="margin-top:24px;">
        <h3 style="flex:1;">按物料汇总</h3>
      </div>
      <table id="summary-table">
        <thead>
          <tr>
            <th>物料料号</th>
            <th>物料名称</th>
            <th>累计退料数量</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
  </div>

  <script src="app.js"></script>
  <script src="return-detail.js"></script>
  <script src="login.js"></script>
</body>
</html>
