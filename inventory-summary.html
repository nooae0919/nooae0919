<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>库存汇总 - SMT线边仓管理系统</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0/dist/iife/sdk.js"></script>
  <script src="lib/xlsx.full.min.js"></script>
  <script src="config.js"></script>
</head>
<body>

  <div id="app-view">
    <header>
      <h1>SMT 线边仓管理系统</h1>
      <div class="user-info">
        <span id="user-name"></span>
        <button id="logout">退出</button>
      </div>
    </header>

    <nav>
      <a href="wo.html">工单管理</a>
      <a href="issue.html">生产领料</a>
      <a href="return.html">生产退料</a>
      <a href="finish.html">成品入库</a>
      <a href="inventory.html">库存管理</a>
      <a href="inventory-summary.html" class="active">库存汇总</a>
    </nav>

    <main>
      <div class="search-bar">
        <input id="sum-search" type="text" placeholder="按物料料号或名称搜索...">
        <button id="sum-search-btn">搜索</button>
        <button id="sum-clear-btn">清空</button>
      </div>

      <div class="toolbar">
        <button id="sum-refresh">刷新</button>
        <button id="sum-export">导出汇总CSV</button>
      </div>

      <table id="sum-table">
        <thead>
          <tr>
            <th>物料料号</th>
            <th>物料名称</th>
            <th>库存总数量</th>
            <th>库位数</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
  </div>

  <script src="app.js"></script>
  <script src="inventory-summary.js"></script>
  <script src="login.js"></script>
</body>
</html>
